<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Solver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-3 px-3">
        <header class="text-center mb-2">
            <h1 class="fw-bold fs-3">Wordle Solver</h1>
            <p class="text-muted small mb-1">Klik tombol template → Pilih mode → Klik tile → Submit</p>
        </header>

        <section id="dictionary-status" class="text-center mb-2">
            <span class="badge bg-secondary" id="dict-badge">Memuat kamus...</span>
        </section>

        <section id="mode-selector" class="text-center mb-2">
            <span class="fw-bold me-2 small">Mode:</span>
            <div class="btn-group btn-group-sm" role="group">
                <input type="radio" class="btn-check" name="tileMode" id="mode-correct" value="correct">
                <label class="btn btn-sm" for="mode-correct">Benar</label>
                <input type="radio" class="btn-check" name="tileMode" id="mode-present" value="present">
                <label class="btn btn-sm" for="mode-present">Salah Posisi</label>
                <input type="radio" class="btn-check" name="tileMode" id="mode-absent" value="absent" checked>
                <label class="btn btn-sm" for="mode-absent">Salah</label>
            </div>
        </section>

        <section id="game-board" class="mb-2">
            <div id="board" class="board-container"></div>
        </section>

        <section id="keyboard" class="mb-2">
            <div id="keyboard-container"></div>
        </section>

        <section id="controls" class="text-center mb-2">
            <button id="submit-btn" class="btn btn-primary btn-sm me-1">Submit</button>
            <button id="undo-btn" class="btn btn-secondary btn-sm me-1">Undo</button>
            <button id="clear-btn" class="btn btn-warning btn-sm me-1">Clear</button>
            <button id="reset-btn" class="btn btn-danger btn-sm">Reset</button>
        </section>

        <section id="feedback" class="mb-2">
            <div id="message" class="alert alert-info d-none py-1 small" role="alert"></div>
        </section>

        <section id="recommendations" class="mb-2">
            <div class="row">
                <div class="col-6">
                    <h6 class="fw-bold mb-1 small">Kata Terbaik (Skor)</h6>
                    <div id="best-suggestions" class="suggestions-container"></div>
                </div>
                <div class="col-6">
                    <h6 class="fw-bold mb-1 small">Kata Filter (Eliminasi)</h6>
                    <div id="filter-suggestions" class="suggestions-container"></div>
                </div>
            </div>
            <div id="word-count" class="text-center text-muted small mt-1"></div>
        </section>

        <section id="letter-stats" class="mb-2">
            <h6 class="fw-bold mb-1 small">Statistik Huruf:</h6>
            <div id="letter-frequency" class="letter-stats-container"></div>
        </section>

        <section id="filter-hints" class="mb-2">
            <h6 class="fw-bold mb-1 small">Huruf yang Perlu Diuji:</h6>
            <div id="filter-letters" class="letter-stats-container"></div>
            <div id="filter-info" class="text-center text-muted small mt-1"></div>
        </section>
    </div>

    <script src="js/dictionary.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
