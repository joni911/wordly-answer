    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='5' y='5' width='90' height='90' rx='10' fill='%236aaa64'/><text x='50' y='68' font-size='50' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>W</text></svg>">

<body>
    <main class="container-fluid py-3 px-3" role="main">
        <header class="text-center mb-2">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <div></div>
                <h1 class="fw-bold fs-3 mb-0">Wordle Solver</h1>
                <button id="lang-toggle" class="btn btn-outline-secondary btn-sm" onclick="toggleLanguage()" aria-label="Toggle language" title="Switch language">EN</button>
            </div>
            <p class="text-muted small mb-1">Free Wordle helper tool — enter guesses, mark letters, get smart recommendations</p>
        </header>

        <section id="dictionary-status" class="text-center mb-2" aria-label="Dictionary status">
            <span class="badge bg-secondary" id="dict-badge">Loading dictionary...</span>
        </section>

        <section id="word-input-section" class="mb-2" aria-label="Word input">
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <input type="text" id="word-input" class="form-control form-control-sm" maxlength="5" placeholder="Type a 5-letter word..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="max-width:200px; text-transform:uppercase; letter-spacing:2px; font-weight:bold; text-align:center;">
                <button id="send-btn" class="btn btn-success btn-sm" aria-label="Send word">Send</button>
            </div>
        </section>

        <section id="mode-selector" class="text-center mb-2" aria-label="Tile mode selector">
            <span class="fw-bold me-2 small">Mode:</span>
            <div class="btn-group btn-group-sm" role="group" aria-label="Tile status mode">
                <input type="radio" class="btn-check" name="tileMode" id="mode-correct" value="correct">
                <label class="btn btn-sm" for="mode-correct">Correct</label>
                <input type="radio" class="btn-check" name="tileMode" id="mode-present" value="present">
                <label class="btn btn-sm" for="mode-present">Wrong Position</label>
                <input type="radio" class="btn-check" name="tileMode" id="mode-absent" value="absent" checked>
                <label class="btn btn-sm" for="mode-absent">Wrong</label>
            </div>
        </section>

        <section id="game-board" class="mb-2" aria-label="Wordle game board">
            <div id="board" class="board-container"></div>
        </section>

        <section id="controls" class="text-center mb-2" aria-label="Controls">
            <button id="undo-btn" class="btn btn-secondary btn-sm me-1" aria-label="Undo last letter">Undo</button>
            <button id="clear-btn" class="btn btn-warning btn-sm me-1" aria-label="Clear last row">Clear</button>
            <button id="edit-template-btn" class="btn btn-info btn-sm me-1" aria-label="Edit templates">Edit Template</button>
            <button id="reset-btn" class="btn btn-danger btn-sm" aria-label="Reset game">Reset</button>
        </section>

        <section id="feedback" class="mb-2" aria-label="Messages">
            <div id="message" class="alert alert-info d-none py-1 small" role="alert"></div>
        </section>

        <section id="recommendations" class="mb-2" aria-label="Word recommendations">
            <div class="row">
                <div class="col-6">
                    <h6 class="fw-bold mb-1 small">Best Words (Score)</h6>
                    <div id="best-suggestions" class="suggestions-container"></div>
                </div>
                <div class="col-6">
                    <h6 class="fw-bold mb-1 small">Filter Words (Elimination)</h6>
                    <div id="filter-suggestions" class="suggestions-container"></div>
                </div>
            </div>
            <div id="word-count" class="text-center text-muted small mt-1"></div>
        </section>

        <section id="letter-stats" class="mb-2" aria-label="Letter frequency statistics">
            <h6 class="fw-bold mb-1 small">Letter Stats:</h6>
            <div id="letter-frequency" class="letter-stats-container"></div>
        </section>

        <section id="filter-hints" class="mb-2" aria-label="Letter testing hints">
            <h6 class="fw-bold mb-1 small">Letters to Test:</h6>
            <div id="filter-letters" class="letter-stats-container"></div>
            <div id="filter-info" class="text-center text-muted small mt-1"></div>
        </section>

        <div id="template-modal" class="modal-overlay" aria-label="Edit templates modal">
            <div class="modal-content">
                <h6 class="fw-bold mb-2">Edit Templates</h6>
                <p class="text-muted small mb-2">Enter 3 five-letter words (a-z only)</p>
                <div id="template-error" class="alert alert-danger py-1 small d-none mb-2"></div>
                <input type="text" class="form-control form-control-sm mb-2 template-input" maxlength="5" placeholder="Template 1">
                <input type="text" class="form-control form-control-sm mb-2 template-input" maxlength="5" placeholder="Template 2">
                <input type="text" class="form-control form-control-sm mb-2 template-input" maxlength="5" placeholder="Template 3">
                <div class="d-flex justify-content-end gap-2">
                    <button id="template-cancel-btn" class="btn btn-secondary btn-sm">Cancel</button>
                    <button id="template-save-btn" class="btn btn-primary btn-sm">Save</button>
                </div>
            </div>
        </div>
    </main>

    <!-- SEO Content (hidden visually, readable by crawlers) -->
    <noscript>
        <section>
            <h2>Wordle Solver — Free Online Word Game Helper</h2>
            <p>Our free Wordle Solver tool helps you find the best words to solve today's Wordle puzzle. Enter your guesses, mark each letter as correct, wrong position, or wrong, and get intelligent word recommendations based on 14,855 English 5-letter words.</p>
            <h3>How to Use Wordle Solver</h3>
            <ol>
                <li>Type a 5-letter word or use quick-fill templates (STAIR, LEMON, PUDGY)</li>
                <li>Click each tile to mark letter status: green (correct), yellow (wrong position), gray (wrong)</li>
                <li>Click Submit to get word recommendations</li>
                <li>Repeat until you find the answer</li>
            </ol>
            <h3>Features</h3>
            <ul>
                <li>Smart word scoring algorithm</li>
                <li>Letter elimination tracking</li>
                <li>Frequency-based recommendations</li>
                <li>Works offline after first load</li>
                <li>14,855 English words database</li>
            </ul>
        </section>
    </noscript>

    <script src="js/dictionary.js?v=3"></script>
    <script src="js/main.js?v=3"></script>
</body>
</html>
